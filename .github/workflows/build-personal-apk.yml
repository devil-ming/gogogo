name: Build Personal APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342"

      - name: Create local configuration
        env:
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
        shell: bash
        run: |
          if [ -z "$TENCENT_MAP_KEY" ]; then
            echo "Missing repository secret: TENCENT_MAP_KEY"
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'TENCENT_MAP_KEY=%s\n' "$TENCENT_MAP_KEY" >> local.properties
          printf 'MAPS_API_KEY=UNUSED\n' >> local.properties

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gogogo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
